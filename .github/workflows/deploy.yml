name: Deploy Static Website to GitHub Pages

# 1. กำหนด Trigger
on:
  push:
    branches:
      - main

# 2. กำหนดสิทธิ์ของระบบ
permissions:
  contents: read
  pages: write
  id-token: write

# 3. จัดการการรันงานซ้ำซ้อน (Concurrency)
concurrency:
  group: 'pages'
  cancel-in-progress: true

# 4. กำหนดภาระงาน (Job)
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # ดึงโค้ดจาก Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # ตั้งค่าสภาพแวดล้อม Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # รวบรวมไฟล์สำหรับ Deploy
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # ไดเรกทอรีไฟล์เว็บ static (เปลี่ยนเป็น ./dist หรือ ./build ได้หากใช้ Framework)

      # นำไฟล์ขึ้น GitHub Pages Server
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
